<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cleaning Empire</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>
🧼 Cleaning Empire — Map Strategy
</header>

<div id="layout">

<!-- ===================== MAP ===================== -->
<div id="map">

<div class="city" onclick="selectCity('Sarasota')">
Sarasota<br>💰 $50/sec
</div>

<div class="city locked" onclick="selectCity('Tampa')">
Tampa<br>🔒 Locked
</div>

<div class="city locked" onclick="selectCity('Orlando')">
Orlando<br>🔒 Locked
</div>

<div class="city locked" onclick="selectCity('Miami')">
Miami<br>🔒 Locked
</div>

<div class="city locked" onclick="selectCity('Jacksonville')">
Jacksonville<br>🔒 Locked
</div>

</div>

<!-- ===================== SIDE PANEL ===================== -->
<div id="panel">

<h2 id="cityName">Select a City</h2>

<div class="stat">💵 Money: $<span id="money">0</span></div>
<div class="stat">🧼 Cleanliness: <span id="clean">100</span>%</div>
<div class="stat">👷 Crews: <span id="crews">0</span></div>
<div class="stat">🚚 Trucks: <span id="trucks">0</span></div>

<button onclick="sendCrew()">Send Crew</button>
<button onclick="upgradeCity()">Upgrade City</button>
<button onclick="hireCrew()">Hire Crew</button>
<button onclick="buyTruck()">Buy Truck</button>
<button onclick="upgradeHQ()">Upgrade HQ</button>
<button onclick="doPrestige()">Prestige Reset</button>

<!-- ===================== LOG ===================== -->
<div id="log"></div>

</div>
</div>

<!-- ===================== CONTRACTS ===================== -->
<div id="contractsContainer"></div>

<!-- ===================== ACHIEVEMENTS ===================== -->
<div id="achievementContainer"></div>

<!-- ===================== SCRIPTS (IMPORTANT ORDER) ===================== -->

<script src="game.js"></script>
<script src="crews.js"></script>
<script src="vehicles.js"></script>
<script src="contracts.js"></script>
<script src="hq.js"></script>
<script src="prestige.js"></script>
<script src="achievements.js"></script>
<script src="ui-polish.js"></script>

</body>
</html>
